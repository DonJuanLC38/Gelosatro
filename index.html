<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E2A25">
<meta name="description" content="Gélosatro : le roguelite du technicien de laboratoire. Identifie les bactéries, débloque géloses et tests.">
<title>GÉLOSATRO · Le roguelite du labo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --chips:#1E9BFF; --chips-d:#0B6BB8; --mult:#FE5F55; --mult-d:#B9342C;
  --gold:#F5B143; --gold-d:#B97A12; --orange:#FDA200; --orange-d:#B86F00;
  --green:#4BC292; --green-d:#2A8A63; --purple:#9B6BE0; --purple-d:#6A41A8;
  --panel:#2E4448; --panel2:#3A5459; --panel-d:#1B2A2D; --edge:#5F7F84;
  --cream:#F4EEDF; --cream-d:#D9CFB6; --ink:#2A2421;
  --txt:#FFFFFF; --soft:#C9D6D6;
  --font:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0E2A25;color:var(--txt);overflow:hidden}
body{font-family:var(--font);font-size:15px;line-height:1.25;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;text-shadow:0 2px 0 rgba(0,0,0,.45)}
button{font-family:var(--font);color:inherit;text-shadow:inherit}

/* Fond tourbillon façon Balatro */
#bg{position:fixed;inset:-30%;z-index:0;background:
  conic-gradient(from 0deg at 50% 50%,#0F3B33,#145446,#0E2A25,#5A1E2A,#0F3B33,#1B6151,#0E2A25,#0F3B33);
  filter:blur(36px) saturate(1.1);animation:swirl 38s linear infinite;opacity:.95}
#bg2{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 50% 40%,transparent 30%,rgba(0,0,0,.55) 100%)}
#scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
@keyframes swirl{to{transform:rotate(360deg)}}

#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 10px 12px}

/* Panneaux / boutons */
.panel{background:var(--panel);border-radius:10px;box-shadow:0 4px 0 var(--panel-d), inset 0 0 0 2px rgba(255,255,255,.04)}
.inset{background:var(--panel-d);border-radius:8px}
.btn{border:0;border-radius:9px;padding:12px 14px;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:transform .06s}
.btn:active{transform:translateY(3px)}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.b-blue{background:var(--chips);box-shadow:0 4px 0 var(--chips-d)}
.b-red{background:var(--mult);box-shadow:0 4px 0 var(--mult-d)}
.b-orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.b-green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.b-gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#3A2400;text-shadow:none}
.b-gray{background:var(--panel2);box-shadow:0 4px 0 var(--panel-d)}
.b-purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn:active{box-shadow:0 1px 0 rgba(0,0,0,.4)}
.icon-btn{border:0;background:var(--panel2);box-shadow:0 3px 0 var(--panel-d);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer}

/* Titre */
.title-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.logo{font-size:52px;font-weight:700;letter-spacing:.02em;line-height:1;color:#fff;text-shadow:0 4px 0 var(--mult-d),0 8px 0 rgba(0,0,0,.35);animation:wob 3s ease-in-out infinite}
.logo span{display:inline-block;animation:bounce 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tagline{font-size:15px;color:var(--soft)}
.menu{display:flex;flex-direction:column;gap:12px;width:min(300px,86%);margin-top:10px}
.lvlbar{width:min(300px,86%);margin-top:8px}
.bar{height:14px;border-radius:7px;background:var(--panel-d);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--chips),#6CC6FF);transition:width .8s ease}
.lvltxt{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-bottom:4px}
.title-cards{display:flex;gap:6px;margin-bottom:8px}
.title-cards .card{animation:float 3s ease-in-out infinite}
.title-cards .card:nth-child(2){animation-delay:.4s;transform:rotate(4deg)} .title-cards .card:nth-child(1){transform:rotate(-6deg)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}

/* HUD */
.hud{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-bottom:8px}
.blind{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.blind .bname{font-size:14px;color:var(--soft)}
.blind .bt{font-size:12px;color:var(--soft)}
.blind .target{font-size:24px;font-weight:700;color:var(--mult);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.boss{color:var(--gold)!important}
.scorebox{padding:8px 10px;display:flex;flex-direction:column;justify-content:center}
.scorebox .lab{font-size:12px;color:var(--soft)}
.scorebox .val{font-size:26px;font-weight:700}
.stats{display:flex;gap:6px;margin-bottom:8px}
.stat{flex:1;padding:6px 4px;text-align:center}
.stat .v{font-size:19px;font-weight:700}
.stat .l{font-size:11px;color:var(--soft)}
.v.time{color:var(--chips)} .v.disc{color:var(--mult)} .v.gold{color:var(--gold)} .v.life{color:#FF8FA3}

.jokers{display:flex;gap:6px;margin-bottom:8px;min-height:62px}
.jk{width:52px;height:62px;border-radius:7px;background:var(--panel-d);border:2px dashed rgba(255,255,255,.12);flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;border-style:dashed}
.jk.on{border:0;background:linear-gradient(160deg,#FFF6D8,#F1D98F);box-shadow:0 3px 0 #9C7B2E;font-size:28px;text-shadow:none}
.jk.on.rare{background:linear-gradient(160deg,#F6E3FF,#C9A4F2);box-shadow:0 3px 0 #6A41A8}
.jk.shake{animation:shake .45s ease}
.jk .pop{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:12px;padding:1px 5px;border-radius:5px;white-space:nowrap;background:var(--mult);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(10deg) scale(1.1)}}

/* Cas patient + paillasse */
.case{padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.case .ico{font-size:30px}
.case .t{font-size:13px;color:var(--soft)}
.case .d{font-size:15px}
.bossbar{font-size:13px;color:var(--gold);margin-top:3px}
.bench{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.bench-empty{margin:auto;text-align:center;color:var(--soft);font-size:14px;padding:10px}
.res{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:7px 9px;animation:pop .3s ease}
.res svg{width:54px;height:54px;flex-shrink:0}
.res .rt{font-size:13px;color:var(--soft)}
.res .rd{font-size:14.5px}
.res .warn{font-size:12px;color:var(--gold)}
.res.bad{box-shadow:inset 3px 0 0 var(--mult)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* Actions + main */
.selinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;font-size:13.5px;color:var(--soft);margin:8px 2px 4px}
.selinfo b{color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.actions .btn{padding:11px 4px;font-size:15px}
.hand{display:flex;justify-content:center;align-items:flex-start;padding:20px 0 4px;margin-top:2px}
.hand .card{transition:transform .15s ease}
.hand .card.sel{transform:translateY(-18px) rotate(0deg)!important}

/* Cartes */
.card{position:relative;width:74px;height:110px;flex-shrink:0;border-radius:8px;background:var(--cream);color:var(--ink);text-shadow:none;box-shadow:0 4px 0 var(--cream-d),0 6px 12px rgba(0,0,0,.35);cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.card .band{height:20px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.03em;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.card .art{flex:1;display:flex;align-items:center;justify-content:center;padding:2px}
.card .art svg{width:46px;height:46px}
.card .nm{font-size:10.5px;font-weight:600;text-align:center;line-height:1.05;padding:0 3px 3px;min-height:23px;display:flex;align-items:center;justify-content:center}
.card .cost{position:absolute;top:22px;left:3px;font-size:11px;font-weight:700;background:var(--chips);color:#fff;border-radius:5px;padding:0 4px;text-shadow:none}
.card .cost.free{background:var(--green)}
.card .chp{position:absolute;top:22px;right:3px;font-size:10px;font-weight:700;color:var(--chips-d)}
.card.na{filter:grayscale(.9) brightness(.7)}
.card.na::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;color:rgba(185,52,44,.75)}
.t-exam .band{background:#6C7A89} .t-micro .band{background:#3D7FD6} .t-milieu .band{background:#2E9E6E} .t-test .band{background:#E0823A} .t-ident .band{background:#8A55C9} .t-clin .band{background:#B0476B} .t-spe .band{background:#222}
.ed-foil{background:linear-gradient(115deg,#F4EEDF 20%,#CFE6FF 40%,#F4EEDF 60%,#D8F2FF 80%);background-size:250% 100%;animation:shine 3s linear infinite}
.ed-holo{background:linear-gradient(160deg,#FFE4E1,#F4EEDF 50%,#FFD5D0)}
.ed-poly{animation:hue 4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.edtag{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5)}

/* Feuilles / modales */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(5,15,14,.72)}
#modal.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;background:var(--panel);border-radius:14px 14px 0 0;box-shadow:0 -4px 0 var(--panel-d);padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet h3{margin:14px 0 6px;font-size:16px;color:var(--gold)}
.sheet p,.sheet li{font-size:14.5px;color:var(--soft);margin:0}
.sheet ol,.sheet ul{margin:0;padding-left:20px}
.sheet li{margin:3px 0}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pk{display:flex;align-items:center;gap:8px;text-align:left;background:var(--panel2);border:0;border-radius:9px;padding:8px;box-shadow:0 3px 0 var(--panel-d);cursor:pointer;font-size:13.5px;font-style:italic}
.pk svg{width:36px;height:36px;flex-shrink:0}
.pk.on{outline:3px solid var(--gold)}
.cat{display:flex;flex-direction:column;gap:8px}
.illus{background:var(--panel-d);border-radius:9px;padding:10px;margin:8px 0;display:flex;justify-content:center}
.illus svg{max-width:100%;height:auto;max-height:150px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.kv b{color:#fff}
.kv span{color:var(--soft)}

/* Calcul du score */
.calc{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0}
.calc .c,.calc .m{min-width:100px;text-align:center;font-size:30px;font-weight:700;padding:8px 10px;border-radius:9px}
.calc .c{background:var(--chips);box-shadow:0 4px 0 var(--chips-d)}
.calc .m{background:var(--mult);box-shadow:0 4px 0 var(--mult-d)}
.calc .x{font-size:28px;color:var(--mult)}
.calc .bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.18)}}
.total{text-align:center;font-size:40px;font-weight:700;margin:4px 0}
.total.fire{color:var(--gold);animation:bump .4s ease 3}
.steps{display:flex;flex-direction:column;gap:5px;margin-top:8px;max-height:220px;overflow-y:auto}
.step{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:7px;padding:6px 9px;font-size:13.5px;opacity:0;transform:translateX(-8px);transition:all .2s}
.step.in{opacity:1;transform:none}
.step .pc{color:var(--chips);font-weight:700} .step .pm{color:var(--mult);font-weight:700} .step .px{color:var(--gold);font-weight:700}
.verdict{text-align:center;font-size:24px;font-weight:700;margin:8px 0}
.good{color:var(--green)} .badc{color:var(--mult)}
.fiche{background:var(--panel-d);border-radius:9px;padding:10px;margin-top:10px}
.fiche .fn{font-size:19px;font-style:italic;font-weight:700}
.trs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tr{font-size:12.5px;background:var(--panel2);border-radius:6px;padding:3px 7px}
.alert{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(254,95,85,.18);color:#FFB3AD;font-size:13.5px}
.path{display:flex;flex-wrap:wrap;gap:5px}
.pth{font-size:12.5px;border-radius:6px;padding:3px 7px;background:var(--panel2)}
.pth.ok{background:rgba(75,194,146,.25);color:#9CF0CB} .pth.no{background:rgba(255,255,255,.06);color:var(--soft)} .pth.il{background:rgba(254,95,85,.22);color:#FFB3AD} .pth.miss{background:transparent;border:1px dashed var(--edge);color:var(--soft)}

/* Boutique */
.shop-h{text-align:center;font-size:30px;font-weight:700;color:var(--gold);margin:4px 0 2px}
.shelf{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px}
.item .price{font-size:15px;font-weight:700;color:var(--gold)}
.item .btn{padding:7px 10px;font-size:14px;width:100%}
.jbig{width:74px;height:110px;border-radius:8px;background:linear-gradient(160deg,#FFF6D8,#F1D98F);box-shadow:0 4px 0 #9C7B2E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:none;color:var(--ink);cursor:pointer;font-size:34px}
.jbig.rare{background:linear-gradient(160deg,#F6E3FF,#C9A4F2);box-shadow:0 4px 0 #6A41A8}
.jbig small{font-size:10px;font-weight:700;text-align:center;line-height:1.05;padding:0 4px}
.sold{opacity:.25;pointer-events:none}

/* Divers */
.row{display:flex;gap:8px}
.grow{flex:1}
.center{text-align:center}
.muted{color:var(--soft)}
.gold{color:var(--gold)}
.big{font-size:22px;font-weight:700}
.scroll{flex:1;overflow-y:auto;min-height:0}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs .btn{flex:1;padding:9px 4px;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--panel2);border-radius:9px;padding:8px;text-align:center;font-size:12px;cursor:pointer;box-shadow:0 3px 0 var(--panel-d);border:0}
.cell svg{width:50px;height:50px}
.cell.lock{opacity:.45}
.cell .n{font-style:italic;margin-top:3px;line-height:1.1}
.troph{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:9px;padding:9px;margin-bottom:7px}
.troph .ti{font-size:30px}
.troph.lock{opacity:.45;filter:grayscale(1)}
.troph .tn{font-size:15px}
.troph .td{font-size:12.5px;color:var(--soft)}
.unl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px}
.unl .lv{min-width:44px;font-weight:700;color:var(--chips)}
.unl.got .lv{color:var(--green)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(calc(-100% - 40px));z-index:60;background:var(--gold);color:#3A2400;text-shadow:none;padding:10px 16px;border-radius:10px;box-shadow:0 4px 0 var(--gold-d);font-weight:700;font-size:15px;transition:transform .3s ease;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.topbar h2{margin:0;font-size:24px}
#poster{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(80,0,0,.55);animation:flash .5s ease}
.pst{width:min(400px,100%);max-height:94%;overflow-y:auto;text-align:center;padding:12px 16px 16px;border-radius:12px;background:#FFE14D;color:#1A1200;text-shadow:none;
  border:8px solid transparent;border-image:repeating-linear-gradient(45deg,#111 0 14px,#FFD000 14px 28px) 12;box-shadow:0 0 0 4px #111,0 12px 40px rgba(0,0,0,.6);
  animation:scream .55s cubic-bezier(.2,1.6,.4,1)}
.pst-top{font-size:13px;letter-spacing:.2em;color:#B00}
.pst-face{font-size:64px;line-height:1;margin:4px 0;animation:shk .12s linear 6}
.pst-h{font-size:36px;font-weight:700;line-height:1;color:#D10000;text-shadow:3px 3px 0 #111;letter-spacing:.02em;margin:4px 0 8px;transform:rotate(-3deg)}
.pst-card{font-size:17px}
.pst-miss{font-size:15px;font-weight:700;background:#111;color:#FFE14D;border-radius:8px;padding:7px 10px;margin:8px 0}
.pst-why{font-size:14.5px;text-align:left;background:rgba(255,255,255,.55);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.3}
.pst-pen{font-size:26px;font-weight:700;color:#fff;background:#FE5F55;display:inline-block;padding:4px 14px;border-radius:8px;box-shadow:0 4px 0 #B9342C;margin:8px 0 12px;transform:rotate(2deg)}
.pst-ok{width:100%;margin-bottom:8px}
@keyframes scream{0%{transform:scale(.3) rotate(-14deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:none}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-6deg)}75%{transform:translateX(4px) rotate(6deg)}}
@keyframes flash{0%{background:rgba(255,0,0,.8)}100%{background:rgba(80,0,0,.55)}}
@media (prefers-reduced-motion: reduce){.pst,.pst-face,#poster{animation:none}#bg,.logo,.logo span,.title-cards .card,.ed-foil,.ed-poly{animation:none}}
@media (min-height:820px){.hand .card{width:78px;height:114px}}
@media (max-width:400px){.hand .card{width:68px;height:104px}.hand .card .art svg{width:40px;height:40px}}
</style>
</head>
<body>
<div id="bg"></div><div id="bg2"></div>
<div id="app"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="scan"></div>
<script>
function rng(seed){ let s = seed % 2147483647; if (s<=0) s += 2147483646; return ()=> (s = s*16807 % 2147483647) / 2147483647; }
const VIO='#6B3FB8', PINK='#E0659C', FIELD='#F2ECE2';

/* Vue microscope */
function micro(type, seed=7){
  const r = rng(seed); let g='';
  const coc=(x,y,rr,c)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}" fill="${c}"/>`;
  const rod=(x,y,l,w,a,c)=>`<rect x="${(x-l/2).toFixed(1)}" y="${(y-w/2).toFixed(1)}" width="${l}" height="${w}" rx="${w/2}" fill="${c}" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  let bg = FIELD;
  if (type==='amas'){ for(let k=0;k<4;k++){ const cx=22+r()*56, cy=22+r()*56; for(let i=0;i<9;i++) g+=coc(cx+(r()-.5)*16,cy+(r()-.5)*16,3.4,VIO);} }
  else if (type==='chain'){ for(let k=0;k<4;k++){ let x=12+r()*30, y=15+k*20+r()*6, a=(r()-.5)*.6; for(let i=0;i<8;i++){ g+=coc(x,y,3.2,VIO); x+=6.6*Math.cos(a); y+=6.6*Math.sin(a); a+=(r()-.5)*.4; } } }
  else if (type==='diplo'){ for(let k=0;k<8;k++){ const x=18+r()*64,y=18+r()*64,a=r()*180; g+=`<g transform="rotate(${a} ${x} ${y})"><ellipse cx="${x-3.6}" cy="${y}" rx="3.6" ry="2.6" fill="${VIO}"/><ellipse cx="${x+3.6}" cy="${y}" rx="3.6" ry="2.6" fill="${VIO}"/><ellipse cx="${x}" cy="${y}" rx="10" ry="6" fill="none" stroke="${VIO}" stroke-opacity=".25" stroke-dasharray="2 2"/></g>`; } }
  else if (type==='bgn'){ for(let k=0;k<14;k++) g+=rod(14+r()*72,14+r()*72,11,4.6,r()*180,PINK); }
  else if (type==='bgnfat'){ for(let k=0;k<10;k++){ const x=16+r()*68,y=16+r()*68,a=r()*180; g+=`<rect x="${x-9}" y="${y-5}" width="18" height="10" rx="5" fill="#fff" stroke="${PINK}" stroke-opacity=".5" transform="rotate(${a} ${x} ${y})"/>`+rod(x,y,11,5,a,PINK);} }
  else if (type==='curve'){ for(let k=0;k<10;k++){ const x=16+r()*64,y=16+r()*64,a=r()*180; g+=`<path d="M${x} ${y} q4 -6 8 0 q4 6 8 0" stroke="${PINK}" stroke-width="3.6" fill="none" stroke-linecap="round" transform="rotate(${a} ${x+8} ${y})"/>`; } }
  else if (type==='cocco'){ for(let k=0;k<24;k++) g+=rod(12+r()*76,12+r()*76,5.5,3.4,r()*180,PINK); }
  else if (type==='cgn'){ g+=`<circle cx="50" cy="50" r="24" fill="#D9C6E8"/><path d="M40 46 q6-10 12 0 q6 10 10 0" stroke="#7A4AA8" stroke-width="7" fill="none" stroke-linecap="round"/>`; for(let k=0;k<6;k++){const x=36+r()*28,y=40+r()*22,a=r()*180; g+=`<g transform="rotate(${a} ${x} ${y})"><path d="M${x-6} ${y} a3.2 3.6 0 1 1 5 0 z" fill="${PINK}"/><path d="M${x+6} ${y} a3.2 3.6 0 1 0 -5 0 z" fill="${PINK}"/></g>`;} for(let k=0;k<3;k++){const x=12+r()*76,y=k<2?14+r()*10:80+r()*8; g+=coc(x-2.6,y,2.6,PINK)+coc(x+2.6,y,2.6,PINK);} }
  else if (type==='bgp'){ for(let k=0;k<5;k++){ const x=18+r()*60,y=18+r()*60,a=r()*180; for(let i=0;i<3;i++) g+=rod(x+i*4.5*Math.sin(a*Math.PI/180),y-i*4.5*Math.cos(a*Math.PI/180),12,3.6,a,VIO); g+=rod(x+10,y+8,11,3.6,a+50,VIO);} }
  else if (type==='bgpshort'){ for(let k=0;k<16;k++) g+=rod(12+r()*76,12+r()*76,7,3.6,r()*180,VIO); }
  else if (type==='levure'){ for(let k=0;k<7;k++){const x=18+r()*62,y=18+r()*62,a=r()*180; g+=`<g transform="rotate(${a} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="6" ry="4.4" fill="${VIO}"/><ellipse cx="${x+7.5}" cy="${y}" rx="2.8" ry="2.2" fill="${VIO}"/></g>`;} g+=`<path d="M10 80 q20 -6 40 2 t40 -4" stroke="${VIO}" stroke-width="3.4" fill="none" stroke-dasharray="7 2"/>`; }
  else if (type==='baar'){ bg='#CFE3F2'; for(let k=0;k<12;k++){const x=16+r()*68,y=16+r()*68,a=r()*180; g+=`<path d="M${x-5} ${y} q5 -2 10 0" stroke="#D2264B" stroke-width="2.2" fill="none" stroke-linecap="round" transform="rotate(${a} ${x} ${y})"/>`;} }
  else if (type==='pnn'){ for(let k=0;k<9;k++){const x=16+r()*68,y=16+r()*68; g+=`<circle cx="${x}" cy="${y}" r="8" fill="#E7D6EF"/><path d="M${x-4} ${y-1} q2-4 4 0 q2 4 4 0" stroke="#7A4AA8" stroke-width="3" fill="none" stroke-linecap="round"/>`;} }
  else if (type==='epi'){ for(let k=0;k<4;k++){const x=22+r()*56,y=22+r()*56; g+=`<path d="M${x-14} ${y-6} l10 -10 l16 2 l4 14 l-10 12 l-16 -2 z" fill="#F7E3D1" stroke="#C99A78"/><circle cx="${x}" cy="${y}" r="3" fill="#8A5E9E"/>`;} }
  else if (type==='mix'){ return micro('bgn',seed); }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="c${type}${seed}"><circle cx="50" cy="50" r="46"/></clipPath></defs><circle cx="50" cy="50" r="48" fill="#2A2A2A"/><circle cx="50" cy="50" r="46" fill="${bg}"/><g clip-path="url(#c${type}${seed})">${g}</g></svg>`;
}

/* Boîte de Pétri */
function dish(o={}, seed=3){
  const r = rng(seed); const agar=o.agar||'#E8D9B5', col=o.col||'#F4F0E6', rad=o.rad||2.6;
  let halos='', cols='', extra='';
  const zones=[[14,48,14,48,o.n1||22],[52,86,14,48,o.n2||12],[52,86,52,86,o.n3||7],[14,48,52,86,o.n4||4]];
  zones.forEach(([x1,x2,y1,y2,n])=>{ for(let i=0;i<n;i++){ const x=x1+r()*(x2-x1), y=y1+r()*(y2-y1); if(Math.hypot(x-50,y-50)>40) continue;
    const c = Array.isArray(col) ? col[i%col.length] : col; const rr = rad*(.75+r()*.5);
    if (o.halo) halos+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rr+o.haloR).toFixed(1)}" fill="${o.halo}"/>`;
    cols+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" fill="${c}" ${o.stroke?`stroke="${o.stroke}" stroke-width="1"`:''}/>`;
    if (o.dot) cols+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rr*.45).toFixed(1)}" fill="${o.dot}"/>`; } });
  if (o.voile) for(let i=1;i<5;i++) extra+=`<circle cx="44" cy="46" r="${i*9}" fill="none" stroke="#F5F2EA" stroke-opacity=".45" stroke-width="5"/>`;
  if (o.empty){ cols=''; halos=''; }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#BFC4C9" opacity=".55"/><circle cx="50" cy="50" r="44" fill="${agar}"/>${extra}${halos}${cols}<circle cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/><path d="M22 20 a40 40 0 0 1 30 -12" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
}

/* Tubes */
function tubeG(x, t){
  const w=22, top=10, h=78; let fill='';
  const id='t'+Math.round(x*7)+(t.lab||'').length;
  const clip=`<clipPath id="${id}"><path d="M${x} ${top} v${h-10} a${w/2} ${w/2} 0 0 0 ${w} 0 v-${h-10} z"/></clipPath>`;
  if (t.slant){ fill+=`<rect x="${x}" y="${top+14}" width="${w}" height="${h}" fill="${t.culot}"/><path d="M${x} ${top+14} L${x+w} ${top+34} L${x+w} ${top+14} z" fill="${t.slant}"/><path d="M${x} ${top+14} L${x+w} ${top+34} L${x+w} ${top+46} L${x} ${top+40} z" fill="${t.slant}"/>`; }
  else fill+=`<rect x="${x}" y="${top+(t.lvl||16)}" width="${w}" height="${h}" fill="${t.c||'#E9DFC0'}"/>`;
  if (t.ring) fill+=`<rect x="${x}" y="${top+(t.lvl||16)}" width="${w}" height="7" fill="${t.ring}"/>`;
  if (t.black) fill+=`<ellipse cx="${x+w/2}" cy="${top+h-6}" rx="${w/2}" ry="11" fill="#2B2321"/>`;
  if (t.stab==='line') fill+=`<rect x="${x+w/2-1.2}" y="${top+20}" width="2.4" height="${h-26}" fill="#8A7458" opacity=".8"/>`;
  if (t.stab==='diffuse') fill+=`<rect x="${x+2}" y="${top+22}" width="${w-4}" height="${h-26}" fill="#fff" opacity=".35"/>`;
  if (t.clot) fill+=`<path d="M${x+3} ${top+50} q8 -10 16 0 v${h-46} h-16 z" fill="#B23A3A" opacity=".85"/>`;
  if (t.umbrella) fill+=`<path d="M${x+3} ${top+30} q8 -8 16 0 q-8 4 -16 0 z" fill="#fff" opacity=".7"/><rect x="${x+w/2-1}" y="${top+26}" width="2" height="${h-34}" fill="#fff" opacity=".5"/>`;
  if (t.trouble) fill+=`<rect x="${x}" y="${top+16}" width="${w}" height="${h}" fill="#fff" opacity=".35"/>`;
  let bubbles='';
  if (t.gas) bubbles=`<g class="anim-bub"><circle cx="${x+7}" cy="${top+h-12}" r="2" fill="none" stroke="#fff"/><circle cx="${x+14}" cy="${top+h-20}" r="1.6" fill="none" stroke="#fff"/></g>`;
  return `${clip}<g clip-path="url(#${id})">${fill}${bubbles}</g><path d="M${x} ${top} v${h-10} a${w/2} ${w/2} 0 0 0 ${w} 0 v-${h-10}" fill="none" stroke="#C9CED3" stroke-width="2"/><rect x="${x-2}" y="${top-6}" width="${w+4}" height="8" rx="2" fill="${t.cap||'#5B8DC9'}"/>${t.lab?`<text x="${x+w/2}" y="${top+h+20}" font-size="9" fill="currentColor" text-anchor="middle">${t.lab}</text>`:''}`;
}
function tubes(list){ const W = list.length*36+8; return `<svg viewBox="0 0 ${W} 122" style="color:var(--soft)" aria-hidden="true">${list.map((t,i)=>tubeG(10+i*36,t)).join('')}</svg>`; }

  }

}

/* ---------- Score ---------- */
function computeScore(rs,catChoice){
  const b=BACT[rs.bid], steps=[]; let chips=b.base, mult=1; steps.push({l:`🦠 ${b.n}`,c:b.base});
  const seen=new Set(); let ill=0,useless=0;
  const manual=rs.played.filter(p=>!p.auto);
  rs.played.forEach(p=>{ const C=CARDS[p.id];
    if(p.ill){ ill++; mult=Math.max(1,mult-1); steps.push({l:`${C.n} : démarche illogique`,m:-1,bad:1});
      if(rs.boss==='audit'){ mult=Math.max(1,mult/2); steps.push({l:`🕵️ Audit COFRAC`,x:.5,bad:1}); } return; }
    if(p.res.nf){ useless++; steps.push({l:`${C.n} : culture inexploitable`,c:0,dim:1}); return; }
    if(b.path.includes(p.id)&&!seen.has(p.id)){ seen.add(p.id); chips+=C.ch; mult+=1; steps.push({l:`${C.n} ✓`,c:C.ch,m:1});
      if(p.ed==='foil'){chips+=30;steps.push({l:'✨ Édition brillante',c:30});}
      if(p.ed==='holo'){mult+=2;steps.push({l:'🌈 Édition holo',m:2});}
      if(p.ed==='poly'){mult*=1.5;steps.push({l:'🔮 Édition polychrome',x:1.5});}
      if(C.media&&has('collec')){chips+=20;steps.push({l:'🧫 Collection de géloses',c:20});}
    } else if(!p.auto){ useless++; steps.push({l:`${C.n} : inutile ici`,c:0,dim:1}); }
  });
  if(rs.time>0){ const v=rs.time*(has('gaspi')?15:5); chips+=v; steps.push({l:`⏱ ${rs.time} restant${rs.time>1?'s':''}`,c:v}); }
  if(has('huile') && manual.slice(0,2).some(p=>p.id==='gram'&&!p.ill)){ mult+=3; steps.push({l:'🫗 Huile à immersion',m:3}); }
  if(has('urino') && rs.pr==='urine'){ mult+=4; steps.push({l:'🧪 Urinologue',m:4}); }
  if(has('fiches')){ const n=new Set([...run.seen,rs.bid]).size; mult+=n; steps.push({l:'📚 Fiches de révision',m:n}); }
  if(has('qual') && ill===0){ mult*=2; steps.push({l:'📋 Démarche qualité',x:2}); }
  if(has('entero') && b.fam==='entero'){ mult*=1.5; steps.push({l:'🦠 Fan d\'entérobactéries',x:1.5}); }
  if(has('lynx') && manual.length<=4){ mult*=3; steps.push({l:'🎯 Œil de lynx',x:3}); }
  if(has('copro') && rs.pr==='selles'){ mult*=2; steps.push({l:'💩 Coproculteur',x:2}); }
  /* bonus d'ordre : examen direct d'abord, Gram avant les tests, aucune carte illogique */
  const firstManual = manual[0], examFirst = rs.played.some(p=>p.auto) || (firstManual && ['cyto','macro'].includes(firstManual.id));
  const iT = manual.findIndex(p=>['test','ident'].includes(CARDS[p.id].t)), iG = manual.findIndex(p=>p.id==='gram');
  const gramOk = iT<0 || !b.path.includes('gram') || (iG>=0 && iG<iT);
  const order = ill===0 && examFirst && gramOk && manual.length>=3;
  if(order){ mult*=1.25; steps.push({l:"🧭 Démarche dans l'ordre",x:1.25}); }
  const catOk = catChoice===b.cat;
  if(catOk){ mult*=1.5; steps.push({l:'💊 Bonne conduite à tenir',x:1.5}); } else { mult*=.5; steps.push({l:'💊 Mauvaise conduite à tenir',x:.5,bad:1}); }
  return {steps,chips,mult,final:Math.floor(chips*Math.round(mult*100)/100),ill,useless,catOk,order,manual:manual.length};
}

    <div id="after"></div>`,1);
  let c=0,m=1; const els=[...$('#steps').children]; $('#cM').textContent='1';
  for(let i=0;i<S.steps.length;i++){ const s=S.steps[i]; els[i].classList.add('in'); els[i].scrollIntoView({block:'nearest'});

  $('#cC').textContent=fmt(S.chips); $('#cM').textContent=fmtM(S.mult);
  const tot=$('#tot'); const final=S.final; const t0=performance.now();

  const win=final>=rs.target;
  if(win){ tot.classList.add('fire'); sfx('win'); } else sfx('lose');
  /* effets */
  const isNew=!meta.found.includes(rs.bid); if(isNew){ meta.found.push(rs.bid); }
  if(!run.seen.includes(rs.bid)) run.seen.push(rs.bid);
  run.ids++; run.total+=final; meta.best=Math.max(meta.best,final); saveMeta();
  addXp(20+Math.floor(final/60));
  if(S.order){ meta.orderCount=(meta.orderCount||0)+1; saveMeta(); trophy('ordre'); if(meta.orderCount>=10) trophy('ordre10'); }
  if(['vcholerae','campylo','etec'].every(k=>meta.found.includes(k)||k===rs.bid)) trophy('voyage');
  if(S.ill===0&&S.useless===0) trophy('perfect'); if(S.manual<=3) trophy('sniper'); if(rs.bid==='ehec'&&catC==='NO') trophy('shu'); if(final>=5000) trophy('big');
  checkCollection();
  let lost=false; if(danger){ run.lives--; run.lostThisAnte=true; lost=true; }
  if(!win){ run.lives--; run.lostThisAnte=true; lost=true; }
  run.streak = lost ? 0 : (run.streak||0)+1; if(run.streak>=5) trophy('serie');
  const dead=run.lives<=0; saveRun();
  $('#after').innerHTML=`${danger?`<div class="alert">☠️ Antibiotique donné alors qu'il fallait s'abstenir : patient en danger ! Tu perds une vie.</div>`:''}
    <div class="verdict ${win?'good':'badc'}">${win?'Manche réussie !':'Score insuffisant… tu perds une vie'}</div>
    ${isNew?`<div class="center gold" style="font-size:15px">📚 Nouvelle bactérie dans ta collection !</div>`:''}
    ${bactFiche(rs.bid)}${pathHTML(rs)}
    <div style="margin-top:14px"><button class="btn ${dead?'b-red':win?'b-gold':'b-blue'}" style="width:100%" data-act="${dead?'over':win?'cash':'retry'}">${dead?'Fin de la garde…':win?'Encaisser 💰':'Nouveau prélèvement'}</button></div>`;
  $('#after').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});
  run._lastFinal=final;
}
const fmtM=m=>String(Math.round(m*100)/100).replace('.',',');
function bump(sel){ const e=$(sel); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
function pathHTML(rs){ const b=BACT[rs.bid]; const played=rs.played;
  const chips=b.path.map(id=>{ const p=played.find(x=>x.id===id&&!x.ill); const lock=CARDS[id].lv>level(); return `<span class="pth ${p?'ok':'miss'}">${p?'✓':lock?'🔒':'○'} ${CARDS[id].n}</span>`; }).join('');
  const extra=played.filter(p=>!b.path.includes(p.id)||p.ill).map(p=>`<span class="pth ${p.ill?'il':'no'}">${p.ill?'⚠':'·'} ${CARDS[p.id].n}</span>`).join('');
  return `<h3>Démarche idéale</h3><div class="path">${chips}</div>${extra?`<h3 style="color:var(--soft)">Hors démarche</h3><div class="path">${extra}</div>`:''}`; }

function cashOut(){ const rs=run.cur; const base=[3,4,5][run.round]; const tb=Math.floor(rs.time/2); const intr=Math.min(5,Math.floor(run.money/5)); const pr=has('prime')?2:0;
  const tot=base+tb+intr+pr; run.money+=tot; if(run.money>=25) trophy('rich');
  sheet(`<div class="shop-h">💰 Encaissement</div><div class="steps">${[[`${ROUNDN[run.round]} réussi`,base],[`Temps restant (${rs.time} ⏱)`,tb],['Intérêts (1 par tranche de 5 💰)',intr],...(pr?[['💶 Prime d\'alternance',pr]]:[])].map(([l,v])=>`<div class="step in"><span>${l}</span><span class="gold">+${v} 💰</span></div>`).join('')}</div>
    <div class="total gold">+${tot} 💰</div><button class="btn b-gold" style="width:100%" data-act="toShop">Aller à la boutique</button>`,1);
  /* progression de manche */
  if(run.round===2){ if(!run.lostThisAnte) trophy('clean'); if(!run.illAnte) trophy('noill'); run.ante++; run.round=0; run.bioUsed=false; run.lostThisAnte=false; run.illAnte=false; meta.bestAnte=Math.max(meta.bestAnte,run.ante); if(run.ante>=4) trophy('garde4'); if(run.ante>=6) trophy('garde6'); saveMeta(); }
  else run.round++;
  if(run.ante>8){ trophy('win'); }
  run.phase='shop'; run.shop=genShop(); run.reroll=2; run.cur=null; saveRun();
}

/* ---------- Boutique ---------- */
function genShop(){ const lv=level(); const pool=Object.keys(JOKERS).filter(j=>!run.jokers.includes(j));
  const pickJ=()=>{ const w=pool.flatMap(j=>Array(JOKERS[j].r?(lv>=7?2:1):3).fill(j)); return rand(w); };
  const js=[]; while(js.length<2&&pool.length>js.length){ const j=pickJ(); if(!js.includes(j)) js.push(j); }
  const cards=unlockedCards().filter(k=>k!=='maldi'); const items=[];
  for(let i=0;i<2;i++){ const r=Math.random(), f=lv>=8?2:1; const ed=r<.04*f?'poly':r<.12*f?'holo':r<.27?'foil':''; items.push({c:inst(rand(cards),ed),p:3+({foil:2,holo:3,poly:4}[ed]||0),sold:0}); }
  return {j:js.map(j=>({j,sold:0})),cards:items}; }
function renderShop(){ if(run.ante>8) return renderVictory(); const s=run.shop;
  app.innerHTML=`<div class="screen">
    <div class="topbar"><h2 class="gold">BOUTIQUE</h2><div class="panel stat" style="flex:0 0 auto;padding:6px 14px"><div class="v gold">${run.money} 💰</div></div></div>
    <div class="muted" style="font-size:13px;margin-bottom:6px">Prochaine manche : garde ${run.ante} · ${ROUNDN[run.round]} · objectif ${fmt(target(run.ante,run.round))}</div>
    <div class="jokers">${[0,1,2,3,4].map(i=>jokerSlot(run.jokers[i],i,1)).join('')}</div>
    <div class="scroll"><div class="panel" style="padding:10px">
      <div class="muted center" style="font-size:13px">Équipements (5 max) · touche pour voir l'effet</div>
      <div class="shelf">${s.j.map((x,i)=>{ const J=JOKERS[x.j]; return `<div class="item ${x.sold?'sold':''}"><div class="jbig ${J.r?'rare':''}" data-act="jinfo" data-j="${x.j}">${J.e}<small>${J.n}</small></div><div class="price">${J.p} 💰</div><button class="btn b-green" data-act="buyJ" data-i="${i}" ${run.money>=J.p&&run.jokers.length<5?'':'disabled'}>Acheter</button></div>`; }).join('')}</div>
      <div class="muted center" style="font-size:13px">Cartes outils (ajoutées à ton paquet)</div>
      <div class="shelf">${s.cards.map((x,i)=>`<div class="item ${x.sold?'sold':''}">${cardHTML(x.c,{static:1,act:`data-act="cinfo" data-id="${x.c.id}"`})}<div class="price">${x.p} 💰</div><button class="btn b-green" data-act="buyC" data-i="${i}" ${run.money>=x.p?'':'disabled'}>Acheter</button></div>`).join('')}</div>
      <div class="row" style="margin-top:4px"><button class="btn b-green grow" data-act="reroll" ${run.money>=run.reroll?'':'disabled'}>🔄 Relancer (${run.reroll} 💰)</button><button class="btn b-gray grow" data-act="deck">🃏 Mon paquet (${run.deck.length})</button></div>
    </div></div>
    <div style="margin-top:10px"><button class="btn b-blue" style="width:100%" data-act="nextRound">Manche suivante ▶</button></div>
  </div>`; }
function deckSheet(){ const counts={}; run.deck.forEach(c=>{counts[c.id+c.ed]=(counts[c.id+c.ed]||{c,n:0}); counts[c.id+c.ed].n++;});
  sheet(`<div class="shead"><h2>Ton paquet · ${run.deck.length} cartes</h2>${X}</div><div class="grid3">${Object.values(counts).map(({c,n})=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px">${cardHTML(c,{static:1,act:`data-act="cinfo" data-id="${c.id}"`})}<span class="muted">×${n}</span></div>`).join('')}</div>`); }
function renderVictory(){ app.innerHTML=`<div class="screen"><div class="title-wrap"><div style="font-size:70px">👑</div><div class="logo" style="font-size:40px">CHEF DE LABO</div><p class="tagline">Tu as tenu 8 gardes. Score total : <b class="gold">${fmt(run.total)}</b><br>${run.ids} identifications.</p><div class="menu"><button class="btn b-gold" data-act="endrun">Retour au menu</button></div></div></div>`; }
function gameOver(){ closeSheet(); const r=run; meta.bestAnte=Math.max(meta.bestAnte,r.ante); saveMeta(); run=null; saveRun();
  app.innerHTML=`<div class="screen"><div class="title-wrap"><div style="font-size:64px">💀</div><div class="logo" style="font-size:36px;text-shadow:0 4px 0 #000">FIN DE GARDE</div>
    <div class="panel" style="padding:14px;width:min(320px,90%)"><div class="kv"><b>Garde atteinte</b><span>${r.ante} / 8</span><b>Identifications</b><span>${r.ids}</span><b>Score total</b><span class="gold">${fmt(r.total)}</span><b>Bactéries vues</b><span>${r.seen.length}</span></div></div>
    <p class="tagline">L'XP gagnée reste acquise. Chaque garde te rapproche des prochains déblocages !</p>
    <div class="menu"><button class="btn b-blue" data-act="new">Reprendre une garde</button><button class="btn b-gray" data-act="title">Menu</button></div></div></div>`; }

/* ---------- Collection / trophées / règles ---------- */
function renderCol(){
  const lv=level(); let body='';
  if(colTab==='bact') body=`<div class="grid3">${BIDS.map(k=>{ const b=BACT[k], f=meta.found.includes(k), lock=b.lv>lv; return `<button class="cell ${f?'':'lock'}" data-act="${f?'bfiche':'none'}" data-k="${k}">${f?micro(b.mi,k.length*7):`<div style="font-size:34px;height:50px;display:flex;align-items:center;justify-content:center">${lock?'🔒':'❔'}</div>`}<div class="n">${f?b.n:lock?'Niv. '+b.lv:'???'}</div></button>`; }).join('')}</div>`;
  if(colTab==='cards') body=`<div class="grid3">${CARD_IDS.map(k=>`<div style="display:flex;justify-content:center">${cardHTML(inst(k),{static:1,lock:CARDS[k].lv>lv&&k!=='maldi',act:CARDS[k].lv>lv&&k!=='maldi'?'':`data-act="cinfo" data-id="${k}"`})}</div>`).join('')}</div>`;
  if(colTab==='jok') body=Object.keys(JOKERS).map(j=>`<div class="troph"><div class="ti">${JOKERS[j].e}</div><div><div class="tn">${JOKERS[j].n} <span class="gold" style="font-size:13px">${JOKERS[j].p} 💰${JOKERS[j].r?' · rare':''}</span></div><div class="td">${JOKERS[j].d}</div></div></div>`).join('');
  app.innerHTML=`<div class="screen"><div class="topbar"><h2>📚 Collection</h2><button class="icon-btn" data-act="title">✕</button></div>
    <div class="tabs">${[['bact',`Bactéries ${meta.found.length}/${BIDS.length}`],['cards','Cartes'],['jok','Équipements']].map(([k,l])=>`<button class="btn ${colTab===k?'b-orange':'b-gray'}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</div>
    <div class="scroll">${body}</div></div>`; }
function renderTroph(){ const lv=level();
  app.innerHTML=`<div class="screen"><div class="topbar"><h2>🏆 Trophées</h2><button class="icon-btn" data-act="title">✕</button></div><div class="scroll">
    ${Object.keys(TROPHIES).map(k=>{ const t=TROPHIES[k], g=meta.trophies.includes(k); return `<div class="troph ${g?'':'lock'}"><div class="ti">${t.e}</div><div><div class="tn">${t.n} <span class="gold" style="font-size:13px">+${t.xp} XP</span></div><div class="td">${t.d}</div></div></div>`; }).join('')}
    <h3 class="gold" style="margin:16px 0 6px">Déblocages par niveau</h3>
    ${Object.keys(UNLOCK_TXT).map(l=>`<div class="unl ${+l<=lv?'got':''}"><span class="lv">${+l<=lv?'✓':'🔒'} N${l}</span><span>${UNLOCK_TXT[l]}${LEVELS[l-1]?` <span class="muted">(${fmt(LEVELS[l-1])} XP)</span>`:''}</span></div>`).join('')}
  </div></div>`; }
function renderHowto(){ app.innerHTML=`<div class="screen"><div class="topbar"><h2>❔ Règles</h2><button class="icon-btn" data-act="title">✕</button></div><div class="scroll panel" style="padding:14px">
  <div class="sheet" style="background:none;box-shadow:none;padding:0;max-height:none;animation:none">
  <h3>🧑‍🔬 Le principe</h3><p>Tu es technicien de garde. À chaque manche, un prélèvement arrive avec une bactérie cachée. Joue tes <b>cartes outils</b> pour obtenir des résultats, puis <b>identifie</b> la bactérie et choisis la conduite à tenir.</p>
  <h3>⏱ Le temps et les défausses</h3><p>Chaque carte coûte du temps. Tu as 10 ⏱ par manche et 3 défausses pour changer les cartes de ta main.</p>
  <h3>🧠 La démarche</h3><p>Respecte l'ordre logique : examen direct → Gram → culture → tests. Jouer une carte trop tôt (oxydase sans culture, catalase sur gélose au sang…) = <b>démarche illogique</b> : une affiche t'explique ton erreur et tu perds 1 mult.</p>
  <h3>🧭 Le bonus d'ordre</h3><p>Examen direct en premier, Gram avant les tests, aucune carte illogique (au moins 3 cartes) : ×1,25 mult.</p>
  <h3>💯 Le score</h3><p><b style="color:var(--chips)">Jetons</b> × <b style="color:var(--mult)">Mult</b>. Chaque carte de la démarche idéale rapporte des jetons et +1 mult. Le temps restant rapporte des jetons. La bonne conduite à tenir multiplie par 1,5.</p>
  <h3>🎯 Les manches</h3><p>Chaque garde = petit prélèvement, gros prélèvement, puis un <b>boss</b> avec une règle spéciale. Atteins l'objectif de score pour gagner des 💰.</p>
  <h3>❤ Les vies</h3><p>Mauvais diagnostic, score insuffisant ou antibiotique dangereux (EHEC, diarrhées toxiniques) = −1 vie. À 0, la garde s'arrête.</p>
  <h3>🛒 La boutique</h3><p>Achète des <b>équipements</b> (effets permanents, 5 max) et des cartes en plus, parfois en édition brillante (+30 jetons), holo (+2 mult) ou polychrome (×1,5).</p>
  <h3>⬆️ La progression</h3><p>Tu gagnes de l'XP à chaque identification et avec les trophées. Les niveaux débloquent de nouvelles cartes, de nouvelles bactéries et la coproculture.</p>
  </div></div></div>`; }

/* ================= ACTIONS ================= */
const ACT={
  new(){ if(run && !confirm('Abandonner la garde en cours ?')) return; startRun(); },
  continue(){ go('game'); },
  title(){ closeSheet(); go('title'); },
  col(){ go('col'); }, troph(){ go('troph'); }, howto(){ go('howto'); },
  tab(d){ colTab=d.t; renderCol(); },
  sound(){ meta.sound=!meta.sound; saveMeta(); render(); },
  sel(d){ const rs=run.cur, u=+d.u; if(rs.sel.includes(u)){ if(rs.sel.length===1){ cardInfo(rs.hand.find(c=>c.u===u).id); return; } rs.sel=rs.sel.filter(x=>x!==u); } else rs.sel.push(u); sfx('sel'); render(); },
  play(){ const rs=run.cur; if(rs.sel.length===1) playCard(rs.sel[0]); },
  disc(){ discardSel(); },
  ident(){ identSheet(); },
  cinfo(d){ cardInfo(d.id); },
  jinfo(d,el){ jokerInfo(d.j, screen==='game'&&run.phase==='shop'&&el.dataset.sell); },
  close(){ closeSheet(); },
  bfiche(d){ sheet(`<div class="shead"><h2>Fiche</h2>${X}</div>${bactFiche(d.k)}`); },
  none(){},
  retry(){ closeSheet(); newRound(); render(); },
  over(){ gameOver(); },
  cash(){ cashOut(); },
  toShop(){ closeSheet(); render(); },
  buyJ(d){ const x=run.shop.j[+d.i], J=JOKERS[x.j]; if(x.sold||run.money<J.p||run.jokers.length>=5) return; run.money-=J.p; run.jokers.push(x.j); x.sold=1;
    if(x.j==='porte'){ run.maxLives++; run.lives++; } if(run.jokers.length>=5) trophy('full'); sfx('buy'); saveRun(); render(); },
  buyC(d){ const x=run.shop.cards[+d.i]; if(x.sold||run.money<x.p) return; run.money-=x.p; run.deck.push(x.c); x.sold=1; sfx('buy'); saveRun(); render(); },
  sell(d){ const j=d.j; run.jokers=run.jokers.filter(x=>x!==j); run.money+=Math.floor(JOKERS[j].p/2); if(j==='porte'){ run.maxLives=Math.max(3,run.maxLives-1); run.lives=Math.min(run.lives,run.maxLives); } closeSheet(); saveRun(); render(); },
  reroll(){ if(run.money<run.reroll) return; run.money-=run.reroll; run.reroll++; run.shop=genShop(); sfx('buy'); saveRun(); render(); },
  deck(){ deckSheet(); },
  nextRound(){ newRound(); render(); },
  endrun(){ run=null; saveRun(); go('title'); },
  menu(){ sheet(`<div class="shead"><h2>Pause</h2>${X}</div><div class="cat"><button class="btn b-gray" data-act="deck">🃏 Mon paquet</button><button class="btn b-gray" data-act="howtoS">❔ Règles</button><button class="btn b-gray" data-act="sound">${meta.sound?'🔇 Couper le son':'🔊 Activer le son'}</button><button class="btn b-red" data-act="title">Menu principal (garde sauvegardée)</button></div>`); },
  howtoS(){ closeSheet(); go('howto'); },
  posterOk(){ const p=$('#poster'); if(p) p.remove(); }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=ACT[el.dataset.act]; if(a){ e.preventDefault(); a(el.dataset,el); } });
render();
</script>
</body>
</html>

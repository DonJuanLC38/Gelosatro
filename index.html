    const cr=$('#cC').getBoundingClientRect(), mr=$('#cM').getBoundingClientRect();
    if(s.c){ c+=s.c; $('#cC').textContent=fmt(c); bump('#cC'); tone(400+i*35,.06); floatTxt(cr.left+cr.width/2,cr.top,'+'+s.c,'#1E9BFF',document.body); }
    if(s.m){ m=Math.max(1,m+s.m); $('#cM').textContent=fmtM(m); bump('#cM'); tone(300+i*25,.07,'sawtooth'); floatTxt(mr.left+mr.width/2,mr.top,(s.m>0?'+':'')+s.m+' mult','#FE5F55',document.body); }
    if(s.x){ m=Math.max(s.x<1?0.5:1,m*s.x); $('#cM').textContent=fmtM(m); bump('#cM'); sfx('x'); floatTxt(mr.left+mr.width/2,mr.top,'×'+String(s.x).replace('.',','),s.x<1?'#555':'#F5B143',document.body); if(s.x>=1.5){ shake($('#sheet'),7); burst(mr.left+mr.width/2,mr.top+mr.height/2,14); } }
    await sleep(RM?0:(s.dim?140:300)); }
  $('#cC').textContent=fmt(S.chips); $('#cM').textContent=fmtM(S.mult);
  const tot=$('#tot'); const final=S.final; const t0=performance.now();
  await new Promise(res=>{ const f=t=>{ const k=Math.min(1,(t-t0)/(RM?1:700)); tot.textContent=fmt(final*k); if(k<1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
  const win=final>=rs.target;
  if(win){ tot.classList.add('fire'); sfx('win'); const tr=tot.getBoundingClientRect(); burst(tr.left+tr.width/2,tr.top+tr.height/2,40); shake($('#sheet'),10); } else { sfx('lose'); shake($('#sheet'),6); }
  /* effets */
  const isNew=!meta.found.includes(rs.bid); if(isNew){ meta.found.push(rs.bid); }

  run.ids++; run.total+=final; meta.best=Math.max(meta.best,final); saveMeta();

  run.discs=run.discs||[]; const dsc=rs.pr; if(!run.discs.includes(dsc)) run.discs.push(dsc); if(new Set(run.discs.map(x=>({urine:'u',selles:'u',pus:'u',crachat:'u'})[x]||x)).size>=3&&run.discs.length>=4) trophy('touche');

  if(['vcholerae','campylo','etec'].every(k=>meta.found.includes(k)||k===rs.bid)) trophy('voyage');
  if(S.ill===0&&S.useless===0) trophy('perfect'); if(S.manual<=3) trophy('sniper'); if(rs.bid==='ehec'&&catC==='NO') trophy('shu'); if(final>=5000) trophy('big');
  checkCollection();
  let lost=false; if(danger){ run.lives--; run.lostThisAnte=true; lost=true; }
  if(!win){ run.lives--; run.lostThisAnte=true; lost=true; }
  run.streak = lost ? 0 : (run.streak||0)+1; if(run.streak>=5) trophy('serie');
  const dead=run.lives<=0; saveRun();
  $('#after').innerHTML=`${danger?`<div class="alert">☠️ Antibiotique donné alors qu'il fallait s'abstenir : patient en danger ! Tu perds une vie.</div>`:''}
    <div class="verdict ${win?'good':'badc'}">${win?'Manche réussie !':'Score insuffisant… tu perds une vie'}</div>

  $('#after').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});

const fmtM=m=>String(m>=10?Math.round(m*10)/10:Math.round(m*100)/100).replace('.',',');

function pathHTML(rs){ const b=BACT[rs.bid]; const played=rs.played;

function cashOut(){ const rs=run.cur; const base=[3,4,5][run.round]; const tb=Math.floor(rs.time/2); const intr=Math.min(5,Math.floor(run.money/5)); const pr=has('prime')?2:0;
  const tot=base+tb+intr+pr; run.money+=tot; if(run.money>=25) trophy('rich');
  sheet(`<div class="shop-h">💰 Encaissement</div><div class="steps">${[[`${ROUNDN[run.round]} réussi`,base],[`Temps restant (${rs.time} ⏱)`,tb],['Intérêts (1 par tranche de 5 💰)',intr],...(pr?[['💶 Prime d\'alternance',pr]]:[])].map(([l,v])=>`<div class="step in"><span>${l}</span><span class="gold">+${v} 💰</span></div>`).join('')}</div>
    <div class="total gold">+${tot} 💰</div><button class="btn b-gold" style="width:100%" data-act="toShop">Aller à la boutique</button>`,1);
  /* progression de manche */
  if(run.round===2){ if(!run.lostThisAnte) trophy('clean'); if(!run.illAnte) trophy('noill'); run.ante++; run.round=0; run.bioUsed=false; run.lostThisAnte=false; run.illAnte=false; meta.bestAnte=Math.max(meta.bestAnte,run.ante); if(run.ante>=4) trophy('garde4'); if(run.ante>=6) trophy('garde6'); saveMeta(); }

function genShop(){ const lv=level(); const pool=Object.keys(JOKERS).filter(j=>!run.jokers.includes(j));
  const pickJ=()=>{ const w=pool.flatMap(j=>Array(JOKERS[j].r?(lv>=7?2:1):3).fill(j)); return rand(w); };
  const js=[]; while(js.length<2&&pool.length>js.length){ const j=pickJ(); if(!js.includes(j)) js.push(j); }
  const tools=unlockedCards().filter(k=>CARDS[k].pr.some(x=>prs().includes(x))); const items=[];
  for(let i=0;i<2;i++){ const r=Math.random(), f=lv>=8?2:1; const ed=r<.12*f?'poly':r<.4*f?'holo':'foil'; const id=rand(tools); items.push({c:{id,ed},p:3+({foil:1,holo:3,poly:5}[ed]),sold:0}); }
  return {j:js.map(j=>({j,sold:0})),cards:items}; }

function musBpm(){ if(!(screen==='game'&&run&&run.cur)) return 84; const lost=Math.max(0,run.maxLives-run.lives); return 92+lost*24+(run.cur.boss?8:0)+(run.cur.time<=3?12:0); }
function musNote(f,t,d,type,vol,lp){ const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  if(lp){ const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; o.connect(fl).connect(g); } else o.connect(g); g.connect(MUS.gain); o.start(t); o.stop(t+d+.02); }
function musNoise(t,d,vol){ const n=AC.createBufferSource(), buf=AC.createBuffer(1,Math.max(1,Math.ceil(AC.sampleRate*d)),AC.sampleRate), ch=buf.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
  n.buffer=buf; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+d); n.connect(f).connect(g).connect(MUS.gain); n.start(t); }

function musSchedule(s,t){ const lost=run?Math.max(0,run.maxLives-run.lives):0, inGame=screen==='game'&&run&&run.cur, k=s%16, bar=Math.floor(s/16);
  if(k%8===0||(lost>=1&&k%4===0)) musNote(k%8===0?60:52,t,.18,'sine',.5);
  if(k%2===1) musNoise(t,.03,inGame?.06:.03);
  if(k%2===0) musNote(BASS[(k/2+bar*8)%16],t,.22,'sawtooth',.11,420);
  if(inGame&&[0,3,6,10,13].includes(k)) musNote(ARP[(k+bar)%4]*(lost>=2?2:1),t,.12,'square',.025,1800);
  if(inGame&&run.lives<=1&&k===14) musNote(880,t,.25,'sine',.05);
}
function musTick(){ if(!AC) return; try{ while(MUS.next<AC.currentTime+.12){ musSchedule(MUS.step,MUS.next); MUS.next+=60/musBpm()/4; MUS.step++; } }catch(e){ musicStop(); } }

const PROF_GRID=(()=>{ const W=34,H=44,g=[...Array(H)].map(()=>Array(W).fill('.'));
  const set=(x,y,c)=>{ if(x>=0&&x<W&&y>=0&&y<H) g[y][x]=c; };
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const dx=(x-16.5)/6.6, dy=(y-12)/7.8; if(dx*dx+dy*dy<=1) set(x,y,'K'); }
  [[11,4],[12,3],[14,3],[15,2],[17,2],[18,3],[20,3],[21,4],[22,5],[10,5]].forEach(([x,y])=>{ set(x,y,'K'); set(x,y+1,'K'); });
  for(let y=19;y<23;y++) for(let x=14;x<20;x++) set(x,y,'K');
  for(let y=22;y<H;y++){ const hw=Math.min(15.5,6+(y-22)*1.35); for(let x=Math.round(16.5-hw);x<=Math.round(16.5+hw);x++) set(x,y,'K'); }
  for(let y=23;y<H;y++){ const o=Math.round((y-23)*.45); set(16-o,y,'C'); set(17+o,y,'C'); if(y>26){ set(15-o,y,'C'); set(18+o,y,'C'); } }
  for(let x=11;x<=14;x++){ set(x,10,'G'); set(x,11,'G'); } for(let x=19;x<=22;x++){ set(x,10,'G'); set(x,11,'G'); } set(15,10,'g'); set(16,10,'g'); set(17,10,'g'); set(18,10,'g'); set(10,10,'g'); set(23,10,'g');
  [[13,16],[14,16],[15,17],[16,17],[17,17],[18,17],[19,16],[20,15],[21,14]].forEach(([x,y])=>set(x,y,'S'));
  for(let y=25;y<36;y++){ set(28,y,'T'); set(29,y,'T'); } set(27,24,'T'); set(30,24,'T'); for(let y=30;y<36;y++){ set(28,y,'L'); set(29,y,'L'); }
  for(let y=34;y<39;y++) for(let x=26;x<32;x++) set(x,y,'K');
  for(let y=1;y<H;y++) for(let x=0;x<W;x++){ if(g[y][x]!=='K') continue; const L=x===0||g[y][x-1]==='.', T=g[y-1][x]==='.', Rr=x===W-1||g[y][x+1]==='.';
    if(L) g[y][x]='r'; else if(T) g[y][x]='m'; else if(Rr) g[y][x]='p'; }
  return g; })();

ACT.tuto=()=>{ closeSheet(); if(run&&!confirm('Abandonner la garde en cours pour refaire le tuto ?')) return; run=null; saveRun(); startTuto(); };

/* ================= FOND D'ACCUEIL : le labo se remplit d'automates avec tes niveaux ================= */
const LABGEAR=[[4,"Centrifugeuse"],[5,"Automate d'hématologie (type Sysmex XN)"],[7,"Analyseur de biochimie (type Cobas)"],[9,"MALDI-TOF (type Bruker)"],[11,"Automate de microbiologie (type Vitek 2)"],[13,"Chaîne robotisée de tubes"],[15,"Automate d'immuno-hématologie (type Qwalis)"],[18,"Écran de supervision et néons"],[21,"Trophée du chef de labo"]];
const labTotal=()=>MODE3.reduce((a,m)=>a+modeLevel(m),0);
function drawGear(ctx,t,n){
  if(n>=4){ P(ctx,30,72,18,12,'#C9D1D8'); ELL(ctx,39,72,9,3,'#9AA6B0'); P(ctx,33,78,4,2,Math.sin(t*8)>0?'#4BFF8A':'#1B5A33'); }
  if(n>=5){ P(ctx,52,60,30,24,'#EEF2F5'); P(ctx,52,60,30,4,'#2F6FB8'); P(ctx,56,66,14,9,'#0E2A1E'); for(let i=0;i<3;i++) P(ctx,57,67+i*3,4+((i*5+Math.floor(t*4))%9),1,'#5CFFB0'); P(ctx,73,66,6,14,'#9AA6B0'); P(ctx,74,68,4,3,'#7B4FC9'); }
  if(n>=7){ P(ctx,86,54,42,30,'#B8C2CA'); P(ctx,86,54,42,3,'#E24B4A'); P(ctx,90,59,16,11,'#0E2A1E'); for(let i=0;i<4;i++) P(ctx,91,60+i*2.5,6+((i*3+Math.floor(t*5))%9),1,'#FFD166');
    const sh=Math.floor(t*6)%14; for(let i=0;i<5;i++) P(ctx,108+((i*3+sh)%18),62,2,7,['#2E9E6E','#E24B4A','#F2D16B','#5B8DC9','#7B4FC9'][i]); P(ctx,108,69,18,2,'#6B7680'); }
  if(n>=9){ P(ctx,130,64,16,20,'#2B3A3E'); P(ctx,133,68,10,5,'#0E1A1E'); if(Math.sin(t*12)>.6) P(ctx,137,73,2,8,'#FE5F55'); }
  if(n>=11){ P(ctx,0,62,26,22,'#DADFE4'); P(ctx,0,62,26,3,'#1FA3A3'); for(let i=0;i<4;i++) P(ctx,3+i*5,68,3,3,Math.sin(t*3+i)>0?'#F5B143':'#7A6A40'); }
  if(n>=13){ P(ctx,0,104,PW,3,'#5A6878'); const sh=(t*18)%24; for(let i=0;i<9;i++){ const x=((i*24+sh)%(PW+24))-12; P(ctx,x,96,4,8,'#E9F1F6'); P(ctx,x,95,4,2,['#E24B4A','#7B4FC9','#2E9E6E','#5B8DC9'][i%4]); } }
  if(n>=15){ P(ctx,150,86,30,0,'#000'); P(ctx,148,88,24,10,'#E8ECF0'); P(ctx,148,88,24,2,'#B97A12'); P(ctx,151,91,6,5,'#FE5F55'); P(ctx,159,91,6,5,'#C9D6D6'); }
  if(n>=18){ P(ctx,106,23,30,9,'#0A0D18'); for(let i=0;i<8;i++) P(ctx,108+i*3.5,31-((i*7+Math.floor(t*3))%7),2,((i*7+Math.floor(t*3))%7),'#5CFFB0'); const on=Math.sin(t*7)>-.7; P(ctx,150,4,34,8,on?'#FF5CA8':'#5A2040'); if(on){ ctx.globalAlpha=.15; P(ctx,146,0,42,16,'#FF5CA8'); ctx.globalAlpha=1; } }
  if(n>=21){ P(ctx,160,24,8,8,'#F5B143'); P(ctx,158,23,12,3,'#FFD166'); P(ctx,162,32,4,2,'#B97A12'); }
}
let titleRAF=null;
function titleBG(){ let cv=document.getElementById('tbg'); if(!cv){ cv=document.createElement('canvas'); cv.id='tbg'; cv.width=PW; cv.height=PH; document.body.prepend(cv); }
  const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false; const n=labTotal();
  const fit=()=>{ const s=Math.max(innerWidth/PW,innerHeight/PH); cv.style.width=PW*s+'px'; cv.style.height=PH*s+'px'; cv.style.left=(innerWidth-PW*s)/2+'px'; cv.style.top=(innerHeight-PH*s)/2+'px'; }; fit(); window.onresize=fit;
  const t0=performance.now(); cancelAnimationFrame(titleRAF);
  const loop=now=>{ if(screen!=='title'){ cv.style.display='none'; return; } cv.style.display='block'; const t=(now-t0)/1000; drawLabBG(ctx,t); drawGear(ctx,t,n); titleRAF=requestAnimationFrame(loop); };
  titleRAF=requestAnimationFrame(loop); }
const _render=render; render=function(){ _render(); const bg=document.getElementById('bg'); if(bg) bg.style.display=screen==='title'?'none':''; try{ if(screen==='title') titleBG(); else { const c=document.getElementById('tbg'); if(c) c.style.display='none'; } }catch(e){ console.error(e); }
  try{ if(meta.music&&AC&&!MUS.timer) musicStart(); }catch(e){} };

window.addEventListener('error',e=>{ try{ busy=false; const a=document.getElementById('anim'); if(a) a.remove(); toast('⚠️ Petit bug : '+String(e.message||'').slice(0,60)); }catch(_){} });
window.addEventListener('unhandledrejection',e=>{ try{ busy=false; const a=document.getElementById('anim'); if(a) a.remove(); }catch(_){} });

render();
</script>
